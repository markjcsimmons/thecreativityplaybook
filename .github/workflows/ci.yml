name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Content and SEO checks (BRIEF §10.6)
        run: npm run check
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Broken internal links in built HTML
        run: npm run check -- --dist
      - name: Lighthouse CI (mobile)
        run: npm run lhci
